name: Agent trigger

# Starts the "Product team" cloud agent right away when the owner acts on agent
# work, instead of waiting for its next scheduled run (02:00, 10:00, 18:00 Berlin):
# - labels an issue agent:ready
# - comments on an issue or PR that has an agent:* label
# - edits an issue that waits for them (agent:needs-owner)
# - reviews or comments on an agent PR (claude/* branch)
# Only the repo owner's actions count. The agent's own comments and issues start
# with "🤖", so they never start another run.
# Needs the repo secret AGENT_TRIGGER_TOKEN (the scheduled task's API token).

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  start-agent:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'agent:ready' && !startsWith(github.event.issue.body, '🤖')) ||
        (github.event_name == 'issues' && github.event.action == 'edited' &&
          contains(github.event.issue.labels.*.name, 'agent:needs-owner')) ||
        (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '🤖') &&
          contains(join(github.event.issue.labels.*.name, ' '), 'agent:')) ||
        (github.event_name == 'pull_request_review' && !startsWith(github.event.review.body, '🤖') &&
          startsWith(github.event.pull_request.head.ref, 'claude/')) ||
        (github.event_name == 'pull_request_review_comment' && !startsWith(github.event.comment.body, '🤖') &&
          startsWith(github.event.pull_request.head.ref, 'claude/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the agent
        env:
          FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_01D4Mgah4JTMKxLsiaPBMmyt/fire
          TOKEN: ${{ secrets.AGENT_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::AGENT_TRIGGER_TOKEN isn't set in this repo, so the agent wasn't started."
            exit 0
          fi
          jq -r --arg ev "$GITHUB_EVENT_NAME" '
            (.issue // .pull_request) as $item
            | [ "GitHub event: \($ev).\(.action)",
                "Repository: \(.repository.full_name)",
                "Item: #\($item.number) (\(if (.pull_request or .issue.pull_request) then "pull request" else "issue" end)): \($item.title)",
                "URL: \((.comment // .review // $item).html_url)",
                (if .label then "Label added: \(.label.name)" else empty end),
                "What the owner wrote:",
                (((.comment // .review).body // (if .action == "edited" then .issue.body else null end) // "(nothing)") | .[0:3000])
              ] | join("\n") | {text: .}' "$GITHUB_EVENT_PATH" > body.json
          curl -sS --fail-with-body -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @body.json | jq -r '"Agent started: " + .claude_code_session_url'
